name: Check Fleremahias Studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test


      - run: npm ci --prefix cloudflare
      - run: node --test cloudflare/worker.test.mjs cloudflare/billing.test.mjs cloudflare/studio.test.mjs cloudflare/catalog.test.mjs cloudflare/review-service.test.mjs

